<!DOCTYPE html>
<!--
  Scout - a personal newsletter studio. The v2 "press-wire" world: a night desk by
  default (#121419) with a daylight paper mode (cream #FAF6EF) and a user-
  customizable accent (ember default). Tokens live in src/styles.css; mode
  (day/night) + accent are set on <html data-mode data-accent> by the
  AccentModeProvider, which defaults to night. The root here is data-mode="night"
  so there is no first-paint flash. Fonts load here via <link> so they are never a late
  CSS @import (a late @import is silently ignored). Three core families, one job each:
  Newsreader (the editorial serif), Hanken Grotesk (the UI sans), Spline Sans Mono
  (the wire-machine texture). The reader's font picker adds five optional reading
  faces (Source Serif 4, Lora, Literata, Inter, Atkinson Hyperlegible); Georgia is
  the picker's pure system option and loads nothing. All web fonts go in the same
  <link> below, never a late @import.
-->
<html lang="en" data-mode="night" data-accent="ember">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="theme-color" content="#121419" />
    <title>Scout</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Literata:wght@400;500;600&family=Inter:wght@400;500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
