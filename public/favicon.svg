<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The Scout mark: the four-point compass star from src/components/scout/Logo.tsx,
    on the night-desk ground so it reads against any tab color. Colors are resolved
    from src/styles.css: the page ground (#121419), the night surface (#1B1E25) for
    the engraved inner star, and the ember night accent (#E2814F), which is the
    app's default accent and the one that holds up on a dark ground.
  -->
  <rect width="32" height="32" rx="8" fill="#121419"/>
  <g transform="translate(16 16) scale(0.88) translate(-16 -16)">
    <path d="M16 2 L18.4 13.6 L30 16 L18.4 18.4 L16 30 L13.6 18.4 L2 16 L13.6 13.6 Z" fill="#E2814F"/>
    <path d="M16 7 L17 15 L25 16 L17 17 L16 25 L15 17 L7 16 L15 15 Z" fill="#1B1E25" opacity="0.55"/>
    <circle cx="16" cy="16" r="2.4" fill="#E2814F"/>
  </g>
</svg>
